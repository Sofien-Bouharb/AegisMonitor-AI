[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name              systemd
    Tag               host.systemd
    Path              /var/log/journal
    DB                /fluent-bit/state/systemd.db
    Read_From_Tail    On

[FILTER]
    Name      lua
    Match     host.*
    script    /fluent-bit/scripts/normalize_signature.lua
    call      normalize_signature

[OUTPUT]
    Name        loki
    Match       host.*
    Host        loki
    Port        3100
    Labels      job=fluent-bit,source=systemd