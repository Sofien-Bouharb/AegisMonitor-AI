global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "localhost"
          env: "local"
    file_sd_configs:
      - files:
          - "/etc/prometheus/targets/node-exporters.yml"
        refresh_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "anomaly-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["anomaly-exporter:9101"]
        labels:
          host: "localhost"
          env: "local"

# Alerting rules will be added here in Weeks 5-6
# rule_files:
