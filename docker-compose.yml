# Usage:
#   docker compose --profile dev up -d    # monitoring + logs
#   docker compose --profile ai up -d     # FastAPI + Ollama only
#   docker compose --profile full up -d   # everything
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    profiles: ["dev", "full"]
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:Z
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:Z
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["dev", "full"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aegis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis}
      - POSTGRES_DB=${POSTGRES_DB:-aegismonitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["dev", "full"]
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # --- AI profile services (added in Weeks 7-8, stubbed here for later) ---
  # fastapi-ai:
  #   build: ./fastapi-ai
  #   profiles: ["ai", "full"]
  #   ...
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles: ["ai", "full"]
  #   ...

  # --- Log pipeline ---
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:Z
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"

  fluent-bit:
    image: fluent/fluent-bit:5.1.2
    container_name: fluent-bit
    profiles: ["dev", "full"]
    restart: unless-stopped
    volumes:
      - ./fluent-bit/config/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:Z
      - ./fluent-bit/scripts/normalize_signature.lua:/fluent-bit/scripts/normalize_signature.lua:ro,Z
      - /run/log/journal:/run/log/journal:ro,z
      - /var/log/journal:/var/log/journal:ro,z
      - /etc/machine-id:/etc/machine-id:ro
      - fluent-bit-state:/fluent-bit/state
    depends_on:
      - loki
volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  redis-data:
  loki-data:
  fluent-bit-state:
