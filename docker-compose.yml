# Usage:
#   docker compose --profile dev up -d    # monitoring + logs only
#   docker compose --profile ai up -d     # FastAPI + Ollama only
#   docker compose --profile full up -d   # everything

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    profiles: ["dev", "full"]
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:Z
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:Z
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["dev", "full"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aegis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis}
      - POSTGRES_DB=${POSTGRES_DB:-aegismonitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["dev", "full"]
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # --- AI profile services (added in Weeks 7-8, stubbed here for later) ---
  # fastapi-ai:
  #   build: ./fastapi-ai
  #   profiles: ["ai", "full"]
  #   ...
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles: ["ai", "full"]
  #   ...

  # --- Log pipeline (added in Weeks 3-4) ---
  # loki:
  #   image: grafana/loki:latest
  #   profiles: ["dev", "full"]
  #   ...
  #
  # fluent-bit:
  #   image: fluent/fluent-bit:latest
  #   profiles: ["dev", "full"]
  #   ...

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  redis-data:
