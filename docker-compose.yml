# Usage:
#   docker compose --profile dev up -d    # monitoring + logs
#   docker compose --profile ai up -d     # FastAPI + Ollama only
#   docker compose --profile full up -d   # everything

secrets:
  telegram_bot_token:
    file: /home/sofien/.config/aegismonitor/secrets/telegram_bot_token
  telegram_chat_id:
    file: /home/sofien/.config/aegismonitor/secrets/telegram_chat_id

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    profiles: ["dev", "full"]
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:Z
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - node-exporter

  # --- P16: Isolation Forest anomaly exporter ---
  anomaly-exporter:
    build: ./ml/anomaly_exporter
    container_name: anomaly-exporter
    profiles: ["dev", "full"]
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: "http://prometheus:9090/api/v1/query"
      MODEL_PATH: "/models/model.joblib"
      METADATA_PATH: "/models/metadata.json"
      EXPORTER_PORT: "9101"
      EVALUATION_INTERVAL_SECONDS: "15"
    volumes:
      - ./models/p15_live_isolation_forest_v2.joblib:/models/model.joblib:ro,Z
      - ./models/p15_live_metadata_v2.json:/models/metadata.json:ro,Z
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: alertmanager
    profiles: ["dev", "full"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - alertmanager-data:/alertmanager
    secrets:
      - telegram_bot_token
      - telegram_chat_id

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:Z
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["dev", "full"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aegis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegis}
      - POSTGRES_DB=${POSTGRES_DB:-aegismonitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # --- P18: Alertmanager PostgreSQL persistence ---
  alert-receiver:
    build:
      context: .
      dockerfile: ml/alert_receiver/Dockerfile
    container_name: alert-receiver
    profiles: ["dev", "full"]
    restart: unless-stopped
    environment:
      ALERT_RECEIVER_HOST: "0.0.0.0"
      ALERT_RECEIVER_PORT: "8080"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegismonitor}
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_DEDUP_TTL_SECONDS: "300"
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["dev", "ai", "full"]
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # --- P20: Correlation API ---
  correlation-api:
    build:
      context: .
      dockerfile: ml/api/Dockerfile
    container_name: correlation-api
    profiles: ["ai", "full"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_CORRELATION_WINDOW_SECONDS: "300"
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-aegismonitor}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
    depends_on:
      - redis

  # Ollama integration will be added in a later milestone.

  # --- Log pipeline ---
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    profiles: ["dev", "full"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:Z
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"

  fluent-bit:
    image: fluent/fluent-bit:5.1.2
    container_name: fluent-bit
    profiles: ["dev", "full"]
    restart: unless-stopped
    volumes:
      - ./fluent-bit/config/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:Z
      - ./fluent-bit/scripts/normalize_signature.lua:/fluent-bit/scripts/normalize_signature.lua:ro,Z
      - /run/log/journal:/run/log/journal:ro,z
      - /var/log/journal:/var/log/journal:ro,z
      - /etc/machine-id:/etc/machine-id:ro
      - fluent-bit-state:/fluent-bit/state
    depends_on:
      - loki

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  redis-data:
  loki-data:
  fluent-bit-state:
  alertmanager-data:
