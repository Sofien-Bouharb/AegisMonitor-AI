global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"
      group_wait: 10s

receivers:
  - name: "default"
    telegram_configs:
      - bot_token_file: "/run/secrets/telegram_bot_token"
        chat_id: 7686787736
        send_resolved: true

  - name: "critical"
    telegram_configs:
      - bot_token_file: "/run/secrets/telegram_bot_token"
        chat_id: 7686787736 
        send_resolved: true